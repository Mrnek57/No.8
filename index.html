<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اقتربت نهاية عروض يوم التأسيس</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F1EFE8;--fg:#0A3D2A;--mut:#5d6b63;--ac:#006C35;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#05160f;--fg:#EFE7D2;--mut:#93a89c;--ac:#3fbf84;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#05160f;--fg:#EFE7D2;--mut:#93a89c;--ac:#3fbf84}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Reem Kufi","Segoe UI",Tahoma,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:1100px}
.stage{position:relative;border-radius:14px;overflow:hidden;background:#4E6B45;line-height:0}
canvas{width:100%;height:auto;display:block}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,40,22,.35);border:0;cursor:pointer}
.ov span{line-height:1.2;background:#E3BE6B;color:#06311f;font:700 24px "Reem Kufi",sans-serif;padding:14px 32px;border-radius:999px}
.bar{display:flex;gap:14px;align-items:center;margin-top:14px;font-size:17px}
button.pb{font:inherit;background:var(--ac);color:#fff;border:0;border-radius:999px;padding:8px 22px;cursor:pointer}
button:focus-visible{outline:3px solid #E3BE6B;outline-offset:3px}
#tr{flex:1;height:10px;background:color-mix(in srgb,var(--fg) 18%,transparent);border-radius:9px;cursor:pointer;position:relative}
#fl{position:absolute;right:0;top:0;bottom:0;width:0;background:#E3BE6B;border-radius:9px}
#tc{color:var(--mut);min-width:60px;text-align:left}
</style></head><body>
<div class="wrap">
<div class="stage"><canvas id="c" width="1920" height="1080"></canvas><button class="ov" id="ov" aria-label="تشغيل"><span>شغّل مع الصوت</span></button></div>
<div class="bar"><button class="pb" id="pb">تشغيل</button><div id="tr" role="slider" aria-label="الشريط الزمني"><i id="fl"></i></div><span id="tc">٠:٠٠</span></div>
</div>
<script>
const C=document.getElementById('c'),x=C.getContext('2d'),W=1920,H=1080,DUR=18;
const K={g:'#006C35',gd:'#04261A',gl:'#0E8B4F',gold:'#E3BE6B',sand:'#EFE2BF',wh:'#FBF9F2'};
const B=[0,3,6,9,12,18],BG=[K.gd,K.sand,K.g,K.gd,K.gd];
const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const eo=u=>1-Math.pow(1-cl(u),4);
const eb=u=>{u=cl(u);return 1+2.9*Math.pow(u-1,3)+1.9*Math.pow(u-1,2)};
const eio=u=>{u=cl(u);return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2};
const AR=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const F=s=>`700 ${s}px "Reem Kufi","Cairo","Segoe UI",Tahoma,sans-serif`;
const circ=(px,py,r,c)=>{x.fillStyle=c;x.beginPath();x.arc(px,py,Math.max(0,r),0,7);x.fill()};
function txt(s,size,cx,by,col,al=1){x.font=F(size);x.direction='rtl';x.textAlign='center';x.fillStyle=col;x.globalAlpha=al;x.fillText(s,cx,by);x.globalAlpha=1}
function rise(s,size,cx,by,u,col,sc=1){
  if(u<=0)return;x.save();x.beginPath();x.rect(0,by-size*1.05,W,size*1.5);x.clip();
  x.translate(cx,by+(1-eo(u))*size*1.2);x.scale(sc,sc);txt(s,size,0,0,col);x.restore()}
function tri(px,py,w,h,c){x.fillStyle=c;x.beginPath();x.moveTo(px-w/2,py);x.lineTo(px,py-h);x.lineTo(px+w/2,py);x.fill()}

function falcon(px,py,sz){x.beginPath();x.moveTo(px-sz*.7,py-sz*.05);x.quadraticCurveTo(px-sz*.3,py-sz*.5,px,py-sz*.05);x.quadraticCurveTo(px+sz*.3,py-sz*.5,px+sz*.7,py-sz*.05);x.stroke();circ(px,py+sz*.02,sz*.08,x.fillStyle)}
function dallah(px,py,sz){x.beginPath();x.moveTo(px-sz*.32,py);x.lineTo(px+sz*.32,py);x.lineTo(px+sz*.18,py-sz*.5);x.lineTo(px-sz*.18,py-sz*.5);x.closePath();x.fill();x.fillRect(px-sz*.08,py-sz*.78,sz*.16,sz*.3);circ(px,py-sz*.82,sz*.1,x.fillStyle);x.beginPath();x.moveTo(px-sz*.2,py-sz*.35);x.quadraticCurveTo(px-sz*.45,py-sz*.45,px-sz*.55,py-sz*.75);x.stroke();x.beginPath();x.arc(px+sz*.3,py-sz*.3,sz*.2,-1.3,1.3);x.stroke()}
function flag(px,py,sz){x.beginPath();x.moveTo(px,py);x.lineTo(px,py-sz);x.stroke();x.beginPath();x.moveTo(px,py-sz);x.quadraticCurveTo(px-sz*.25,py-sz*1.08,px-sz*.5,py-sz*.95);x.lineTo(px-sz*.5,py-sz*.55);x.quadraticCurveTo(px-sz*.25,py-sz*.68,px,py-sz*.6);x.stroke()}
function strip(col){x.save();x.strokeStyle=col;x.fillStyle=col;x.lineWidth=5;x.lineCap='round';x.lineJoin='round';x.globalAlpha=.78;
  for(let i=0;i<20;i++){const px=58+i*96,k=i%5;
    if(k==0)arch(px,56,36);else if(k==1)palm(px,56,40);else if(k==2)falcon(px,48,38);else if(k==3)dallah(px,56,36);else flag(px,56,38);
    circ(px+48,40,4,col)}
  x.restore()}
function fort(p){x.save();x.fillStyle=p[2]?'rgba(122,90,58,.16)':'rgba(239,226,191,.17)';x.beginPath();x.moveTo(0,H);
  for(let i=0;i<16;i++){const hh=H-80-rnd2(i+3)*70-(i%5==2?70:0);x.lineTo(i*120+8,hh);x.lineTo(i*120+112,hh)}
  x.lineTo(W,H);x.fill();
  [380,1500].forEach(tx=>{x.beginPath();x.moveTo(tx-46,H);x.lineTo(tx-30,H-330);x.lineTo(tx-16,H-350);x.lineTo(tx+16,H-350);x.lineTo(tx+30,H-330);x.lineTo(tx+46,H);x.fill()});
  const wc=p[2]?'#A88A5C':p[1];x.fillStyle=wc;x.globalAlpha=.55;
  for(let i=0;i<16;i++){const hh=H-80-rnd2(i+3)*70-(i%5==2?70:0);tri(i*120+60,hh+62,16,26,wc)}
  [380,1500].forEach(tx=>{for(let k=0;k<4;k++)tri(tx,H-250+k*60,14,24,wc)});
  x.restore()}
let GRP=null;
function grain(){if(!GRP){const g=document.createElement('canvas');g.width=g.height=256;const c=g.getContext('2d'),d=c.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=16}c.putImageData(d,0,0);GRP=x.createPattern(g,'repeat')}x.fillStyle=GRP;x.fillRect(0,0,W,H)}

  const pu=Math.exp(-((t%.5)/.5)*5);x.save();SC[s](t-B[s],t,pu);x.restore();if(!NOSTRIP.includes(s))strip(PAL[s%PAL.length][2]?'#7A5A3A':K.sand);wipes(t);
  x.fillStyle=K.gold;x.fillRect(W-W*(t/DUR),H-10,W*(t/DUR),10);
}

// sound effects only: clock ticks, hits, sand hiss, countdown thumps, click, whooshes
let ac;
function audio(from){
  if(ac)ac.close();ac=new AudioContext();const base=ac.currentTime+.05,at=b=>base+b-from;
  const m=ac.createGain();m.gain.value=.55;m.connect(ac.destination);
  const nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const env=(g,t,v,dur)=>{g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+dur)};
  const noise=(t,type,f,v,dur)=>{const s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();s.buffer=nb;fl.type=type;fl.frequency.value=f;env(g,t,v,dur);s.connect(fl).connect(g).connect(m);s.start(t);s.stop(t+dur)};
  const osc=(t,type,f,v,dur,f2)=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur*.7);env(g,t,v,dur);o.connect(g).connect(m);o.start(t);o.stop(t+dur)};
  const ev=(tm,fn)=>{if(tm>=from-.01)fn(at(tm))};
  const hit=t=>{osc(t,'sine',120,1,.55,35);noise(t,'lowpass',900,.5,.25)};
  const tick=(t,hi)=>noise(t,'bandpass',hi?4200:3000,.35,.04);
  const click=t=>{noise(t,'bandpass',2500,.6,.05);noise(t+.06,'bandpass',3500,.4,.04)};
  const shim=t=>{noise(t,'highpass',6500,.16,.4);noise(t+.05,'bandpass',9000,.1,.3)};
  for(let i=1;i<=11;i++)ev(i*.5,t=>tick(t,i%2));
  ev(1.05,hit);ev(4.1,hit);
  [3.2,4.1,5].forEach(v=>ev(v,t=>noise(t,'highpass',5000,.08,.9)));
  [6,6.6,7.2].forEach(v=>ev(v,hit));ev(7.8,t=>{hit(t);shim(t+.1)});ev(8.5,t=>osc(t,'sine',100,.5,.4,40));
  ev(9.4,hit);ev(10.5,click);ev(10.6,shim);ev(12.3,hit);ev(12.5,shim);ev(13.6,shim);ev(15,shim);ev(16.5,t=>{hit(t);shim(t+.1)});
  for(let b=1;b<5;b++){const w=B[b]-.3;if(w<from)continue;const t=at(w),s=ac.createBufferSource(),fl=ac.createBiquadFilter(),g=ac.createGain();
    s.buffer=nb;fl.type='bandpass';fl.Q.value=2;fl.frequency.setValueAtTime(300,t);fl.frequency.exponentialRampToValueAtTime(5000,t+.6);
    g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.4,t+.3);g.gain.linearRampToValueAtTime(.001,t+.6);s.connect(fl).connect(g).connect(m);s.start(t);s.stop(t+.7)}
}

const pb=document.getElementById('pb'),ov=document.getElementById('ov'),fl=document.getElementById('fl'),tc=document.getElementById('tc'),tr=document.getElementById('tr');
let playing=false,off=1.8,st=0,fresh=true;
const cur=()=>playing?Math.min(DUR,off+(performance.now()-st)/1000):off;
function play(from){off=from;st=performance.now();playing=true;pb.textContent='إيقاف مؤقت';ov.style.display='none';fresh=false;try{audio(off)}catch(e){}}
function pause(){off=cur();playing=false;pb.textContent='تشغيل';if(ac)ac.close()}
pb.onclick=()=>{if(playing)pause();else play(fresh||off>=DUR?0:off)};
ov.onclick=()=>play(0);
tr.onclick=e=>{const r=tr.getBoundingClientRect(),t=cl((r.right-e.clientX)/r.width)*DUR;fresh=false;ov.style.display='none';if(playing)play(t);else off=t};
function loop(){
  let t=cur();if(playing&&t>=DUR){playing=false;off=DUR;pb.textContent='إعادة';setTimeout(()=>{ac&&!playing&&ac.close()},2500)}
  draw(t);fl.style.width=(t/DUR*100)+'%';tc.textContent=AR('0:'+String(Math.floor(t)).padStart(2,'0'));requestAnimationFrame(loop)}
loop();
document.fonts&&document.fonts.load('700 100px "Reem Kufi"','اقتربت ٠١٢٣');
